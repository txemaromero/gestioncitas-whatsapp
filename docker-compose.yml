# Local PostgreSQL alternative to embedded-postgres (`pnpm db:local`).
# Usage: docker compose up -d   → postgresql://postgres:postgres@localhost:5432/clinicai
services:
  postgres:
    image: postgres:17-alpine
    container_name: clinicai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinicai
    # F33: only from this machine (the password is the default one).
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - clinicai-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinicai-pg:
